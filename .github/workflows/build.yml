name: Build

on:
  push:
    branches: [ "main", "claude/**" ]
    paths:
      - ".github/workflows/build.yml"
      - "Ice/**/*.swift"
      - "Ice.xcodeproj/**"
  pull_request:
    paths:
      - "Ice/**/*.swift"
      - "Ice.xcodeproj/**"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: xcodebuild -project Ice.xcodeproj -scheme Ice build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
